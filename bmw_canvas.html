<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>Canvas Bezier Circle</title>
</head>
<body>

<canvas id="myCanvas" width="500" height="500"></canvas>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// Zunanji krog
ctx.beginPath();
ctx.arc(250, 250, 195, 0, Math.PI * 2);
ctx.strokeStyle = "gray";
ctx.lineWidth = 10;
ctx.stroke();

// Črn krog
ctx.beginPath();
ctx.arc(250, 250, 190, 0, Math.PI * 2);
ctx.fillStyle = "black";
ctx.fill();

// Notranji krog
ctx.beginPath();
ctx.arc(250, 250, 120, 0, Math.PI * 2);
ctx.fillStyle = "white";
ctx.fill();

// Bezierjeva četrtina kroga
ctx.beginPath();
ctx.moveTo(250, 250);
ctx.lineTo(371, 250);
ctx.quadraticCurveTo(359, 359, 250, 371);
ctx.closePath();
ctx.fillStyle = "#4599fe";
ctx.fill();

// Nasprotna četrtina
ctx.beginPath();
ctx.moveTo(250, 250);
ctx.lineTo(129, 250);
ctx.quadraticCurveTo(139, 139, 250, 129);
ctx.closePath();
ctx.fillStyle = "#4599fe";
ctx.fill();

// Sredinske črte
ctx.beginPath();
ctx.moveTo(250, 125);
ctx.lineTo(250, 375);
ctx.moveTo(125, 250);
ctx.lineTo(375, 250);
ctx.strokeStyle = "black";
ctx.lineWidth = 5;
ctx.stroke();

// Notranja obroba
ctx.beginPath();
ctx.arc(250, 250, 120, 0, Math.PI * 2);
ctx.strokeStyle = "gray";
ctx.lineWidth = 2;
ctx.stroke();

// Črka W
ctx.save();
ctx.translate(250, 250);
ctx.rotate(Math.PI / 4);
ctx.fillStyle = "white";
ctx.font = "bold 60px Arial";
ctx.fillText("W", -24.5, -135);
ctx.restore();

// Črka M
ctx.fillStyle = "white";
ctx.font = "bold 60px Arial";
ctx.fillText("M", 225.5, 115);

// Črka B
ctx.save();
ctx.translate(250, 250);
ctx.rotate(-Math.PI / 4);
ctx.fillStyle = "white";
ctx.font = "bold 60px Arial";
ctx.fillText("B", -24.5, -135);
ctx.restore();

</script>
</body>
</html>
